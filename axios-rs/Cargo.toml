[package]
name = "axios_rs"
version = "0.0.10"
edition = "2024"
rust-version = "1.85.0"
description = "Behavioral Engine for Liquidity Provision in DeFi Protocols"
documentation = "https://docs.rs/axios-rs/"
readme = "README.md"
repository = "https://github.com/IFFranciscoME/axios-rs"
license = "Apache-2.0"
keywords = ["crypto", "defi", "lending", "math", "trading"]
categories = ["data-structures", "development-tools", "finance", "simulation"]
exclude = ["*.log", ".github", "Makefile.toml", "assets/*", "tags"]
include = ["../katex-header.html", "Cargo.toml", "README.md", "src/**/*"]
publish = true

[package.metadata.docs.rs]
private-doc = true

[[bin]]
name = "axios_rs"
path = "src/bin.rs"

[[test]]
name = "test_axios"
path = "test/integration_test.rs"

[dependencies]
csv = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
