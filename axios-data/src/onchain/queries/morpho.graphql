################################################################################
# TABLE 3: IRM State + Interest Rate Curve
################################################################################

query IrmState($uniqueKey: String!, $chainId: Int!, $curvePoints: Int!) {
  marketByUniqueKey(uniqueKey: $uniqueKey, chainId: $chainId) {
    uniqueKey
    irmAddress
    state {
      borrowApy
      supplyApy
      avgBorrowApy
      avgSupplyApy
      rateAtUTarget
    }
    currentIrmCurve(numberOfPoints: $curvePoints) {
      utilization
      borrowApy
      supplyApy
    }
  }
}

