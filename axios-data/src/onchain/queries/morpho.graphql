################################################################################
# TABLE 16: Asset Price History
################################################################################

query HistoricalAssetPrice($address: String!, $chainId: Int!, $options: TimeseriesOptions) {
  assetByAddress(address: $address, chainId: $chainId) {
    address
    symbol
    historicalPriceUsd(options: $options) { x y }
  }
}

