################################################################################
# TABLE 4: Derived Metrics (APYs, Rewards, Utilization)
################################################################################

query DerivedMetrics($chainIds: [Int!], $first: Int!, $skip: Int!) {
  markets(
    first: $first
    skip: $skip
    orderBy: SupplyAssetsUsd
    orderDirection: Desc
    where: { chainId_in: $chainIds }
  ) {
    items {
      uniqueKey
      state {
        utilization
        supplyApy
        borrowApy
        avgSupplyApy
        avgBorrowApy
        avgNetSupplyApy
        avgNetBorrowApy
        rewards {
          asset { address symbol }
          supplyApr
          borrowApr
        }
      }
    }
    pageInfo { countTotal }
  }
}

# Variables:
# { "chainIds": [1, 8453], "first": 100, "skip": 0 }

################################################################################
# TABLE 6: Oracle Data (Chainlink & Morpho Oracles)
################################################################################

query OracleData($chainIds: [Int!], $first: Int!, $skip: Int!) {
  markets(
    first: $first
    skip: $skip
    where: { chainId_in: $chainIds }
  ) {
    items {
      uniqueKey
      oracleAddress
      oracle {
        address
        type
        baseFeedOne { address chain { id } }
        baseFeedTwo { address }
        quoteFeedOne { address }
        quoteFeedTwo { address }
      }
      oracleInfo { type }
    }
    pageInfo { countTotal }
  }
}

# Variables:
# { "chainIds": [1], "first": 100, "skip": 0 }

################################################################################
# TABLE 7: Collateral-Specific Protocol Data
################################################################################

query CollateralData($chainIds: [Int!], $first: Int!, $skip: Int!) {
  markets(
    first: $first
    skip: $skip
    where: { chainId_in: $chainIds }
  ) {
    items {
      uniqueKey
      lltv
      collateralAsset {
        address
        symbol
        decimals
        priceUsd
      }
      state {
        collateralAssets
        collateralAssetsUsd
      }
    }
    pageInfo { countTotal }
  }
}

# Variables:
# { "chainIds": [1, 8453], "first": 100, "skip": 0 }

################################################################################
# TABLE 10: Vault Data (MetaMorpho Vaults)
################################################################################

query VaultData($chainIds: [Int!], $first: Int!, $skip: Int!) {
  vaults(
    first: $first
    skip: $skip
    orderBy: TotalAssetsUsd
    orderDirection: Desc
    where: { chainId_in: $chainIds }
  ) {
    items {
      address
      name
      symbol
      chain { id }
      asset { address symbol decimals }
      state {
        totalAssets
        totalAssetsUsd
        totalSupply
        fee
        apy
        netApy
        allocation {
          market { uniqueKey }
          supplyAssets
          supplyAssetsUsd
          supplyCap
        }
      }
    }
    pageInfo { countTotal }
  }
}

# Variables:
# { "chain": [1, 8453], "first": 100, "skip": 0 }

################################################################################
# TABLE 11: Vault Strategy (Queue & Allocation Details)
################################################################################

query VaultStrategy($address: String!, $chainId: Int!) {
  vaultByAddress(address: $address, chainId: $chainId) {
    address
    name
    timelock
    supplyQueue { 
      uniqueKey 
      lltv 
      loanAsset { symbol } 
      collateralAsset { symbol } 
    }
    withdrawQueue { uniqueKey lltv }
    state {
      allocation {
        market { uniqueKey lltv }
        supplyCap
        supplyAssets
        supplyAssetsUsd
        pendingSupplyAssets
        enabled
      }
    }
  }
}

# Variables:
# { "address": "0xBEEF01735c132Ada46AA9aA4c54623cAA92A64CB", "chainId": 1 }

################################################################################
# TABLE 15: Historical Market Time Series (REQUIRES CHUNKING)
################################################################################

query HistoricalMarket($uniqueKey: String!, $chainId: Int!, $options: TimeseriesOptions) {
  marketByUniqueKey(uniqueKey: $uniqueKey, chainId: $chainId) {
    uniqueKey
    historicalState {
      supplyAssets(options: $options) { x y }
      borrowAssets(options: $options) { x y }
      supplyAssetsUsd(options: $options) { x y }
      borrowAssetsUsd(options: $options) { x y }
      supplyApy(options: $options) { x y }
      borrowApy(options: $options) { x y }
      utilization(options: $options) { x y }
      fee(options: $options) { x y }
    }
  }
}

