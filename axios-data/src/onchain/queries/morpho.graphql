# Morpho API GraphQL Queries
# Endpoint: https://api.morpho.org/graphql

################################################################################
# TABLE 2: Market State (Current Snapshot)
################################################################################

query MarketState($chainIds: [Int!], $first: Int!, $skip: Int!) {
  markets(
    first: $first
    skip: $skip
    orderBy: SupplyAssetsUsd
    orderDirection: Desc
    where: { chainId_in: $chainIds }
  ) {
    items {
      uniqueKey
      lltv
      oracleAddress
      irmAddress
      loanAsset { address symbol decimals }
      collateralAsset { address symbol decimals }
      state {
        borrowAssets
        borrowAssetsUsd
        supplyAssets
        supplyAssetsUsd
        collateralAssets
        collateralAssetsUsd
        liquidityAssets
        liquidityAssetsUsd
        utilization
        fee
        timestamp
      }
    }
    pageInfo { countTotal }
  }
}

# Variables:
